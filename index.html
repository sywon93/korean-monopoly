<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>국어 모두의 마블</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

  :root {
    --cream: #FFF8EF;
    --beige: #F3E7D6;
    --pink: #FFD9E8;
    --pink-deep: #FF9EBB;
    --mint: #CFF5E7;
    --mint-deep: #63C9A6;
    --text: #5A4632;
    --text-soft: #9A8871;
    --card-bg: #FFFEFB;
    --board-text: #38260F;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background: linear-gradient(160deg, var(--cream) 0%, var(--beige) 100%);
    font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: var(--text);
  }

  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  select, input { font-family: inherit; }

  .btn-primary, .btn-secondary, .btn-danger {
    border-radius: 999px;
    font-weight: 700;
    padding: 0.65rem 1.3rem;
    font-size: 0.95rem;
    transition: transform 0.15s;
  }
  .btn-primary { background: linear-gradient(135deg, var(--mint-deep), var(--mint)); color: #2f5a48; box-shadow: 0 6px 14px rgba(99,201,166,0.4); }
  .btn-secondary { background: var(--card-bg); color: var(--text-soft); border: 2px solid #E9DFCE; }
  .btn-danger { background: linear-gradient(135deg, #FF9E8F, #FFC2B4); color: #7a2e20; box-shadow: 0 6px 14px rgba(255,142,120,0.4); }
  .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover { transform: translateY(-2px); }
  .btn-small { padding: 0.45rem 0.9rem; font-size: 0.8rem; }
  .btn-big { padding: 1rem 2.2rem; font-size: 1.15rem; }
  .btn-block { width: 100%; }

  /* ---------- 시작 화면 ---------- */
  .setup-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--cream) 0%, var(--pink) 120%); z-index: 200; padding: 1rem;
  }
  .setup-card {
    background: var(--card-bg); border-radius: 28px; padding: 2rem 2.2rem; text-align: center;
    box-shadow: 0 20px 40px rgba(180,140,110,0.25); max-width: 440px; width: 100%; max-height: 92vh; overflow-y: auto;
  }
  .setup-card h1 { font-size: 1.5rem; margin: 0 0 0.3rem; }
  .setup-card p { color: var(--text-soft); margin: 0.2rem 0; font-size: 0.9rem; }
  .setup-label { margin-top: 1.2rem; font-weight: 700; font-size: 0.9rem; }
  .setup-team-count { display: flex; gap: 0.6rem; justify-content: center; margin: 0.6rem 0 0.8rem; }
  .count-btn { background: var(--card-bg); border: 2px solid #E9DFCE; border-radius: 14px; padding: 0.6rem 1rem; font-weight: 700; color: var(--text-soft); }
  .count-btn.selected { background: var(--pink); border-color: var(--pink-deep); color: #7a3a55; }
  .setup-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin: 0.5rem 0; text-align: left; }
  .setup-row label { font-weight: 700; font-size: 0.85rem; flex: 1; }
  .setup-row input { width: 90px; padding: 0.45rem 0.6rem; border-radius: 12px; border: 2px solid #E9DFCE; text-align: center; }
  #start-game-btn { margin-top: 1.3rem; }

  /* ---------- 앱 레이아웃 ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  .app-header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 0.8vh 1.2vw; gap: 0.6vw;
  }
  .app-title { font-size: clamp(0.9rem, 1.9vw, 1.3rem); font-weight: 700; margin: 0; white-space: nowrap; }
  .header-stats { display: flex; gap: 0.6vw; align-items: center; flex-wrap: wrap; }
  .stat-badge {
    background: var(--card-bg); border-radius: 999px; padding: 0.35rem 0.85rem; font-weight: 700;
    font-size: clamp(0.65rem, 1.3vw, 0.85rem); box-shadow: 0 3px 8px rgba(180,140,110,0.15); white-space: nowrap;
  }
  .teacher-btn {
    background: var(--pink); color: #7a3a55; border-radius: 999px; width: clamp(2.2rem, 4vw, 2.8rem); height: clamp(2.2rem, 4vw, 2.8rem);
    font-size: clamp(1rem, 2vw, 1.3rem); box-shadow: 0 4px 10px rgba(255,158,187,0.4); flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- 메인 영역 (보드 80% : 로스터 20%) ---------- */
  .main-area { flex: 1 1 auto; display: flex; overflow: hidden; padding: 0 1.2vw 1.2vh; gap: 1vw; }

  .board-wrap { flex: 0 0 80%; max-width: 80%; height: 100%; position: relative; }
  .board {
    width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 0.35vh; background: #FBE9D8; border-radius: 22px; padding: 0.7vh; box-shadow: 0 14px 30px rgba(180,140,110,0.2);
  }
  .square {
    border-radius: 12px; background: var(--card-bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; text-align: center; padding: 2px; font-weight: 800; color: var(--board-text); position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6); transition: background 0.3s;
  }
  .square.type-start { background: var(--pink); }
  .square.type-exile { background: #D7D0F0; }
  .square.type-olympic { background: #FFD97A; }
  .square.type-travel { background: #BEE3FF; }
  .square.owned { box-shadow: inset 0 0 0 3px white, 0 4px 8px rgba(0,0,0,0.2); }
  .sq-name { font-size: clamp(0.75rem, 1.9vmin, 1.3rem); font-weight: 800; line-height: 1.08; text-shadow: 0 1px 0 rgba(255,255,255,0.55); }
  .sq-price { font-size: clamp(0.7rem, 1.6vmin, 1.15rem); font-weight: 800; color: #4a3418; }
  .sq-owner-badge { position: absolute; top: 1px; right: 2px; font-size: clamp(0.85rem, 2.1vmin, 1.4rem); }
  .sq-star { position: absolute; top: 1px; left: 2px; font-size: clamp(0.8rem, 1.9vmin, 1.25rem); }
  .sq-tokens { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; }
  .token { font-size: clamp(1rem, 2.6vmin, 1.7rem); }

  .board-center {
    position: absolute; top: 12.5%; left: 12.5%; width: 75%; height: 75%; background: var(--card-bg);
    border-radius: 20px; box-shadow: inset 0 0 0 3px var(--pink); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.6vmin; padding: 1vmin; text-align: center;
  }
  .center-title { font-weight: 700; color: var(--pink-deep); font-size: clamp(0.7rem, 1.7vmin, 1rem); }
  .turn-indicator {
    padding: 0.3rem 1rem; border-radius: 999px; font-weight: 700; font-size: clamp(0.7rem, 1.6vmin, 1rem);
    border: 3px solid var(--pink-deep); background: var(--pink);
  }
  .fund-line, .olympic-line { font-size: clamp(0.6rem, 1.3vmin, 0.85rem); font-weight: 700; color: var(--text-soft); }
  .dice-row { display: flex; gap: 1vmin; }
  .die { font-size: clamp(1.6rem, 5vmin, 2.6rem); line-height: 1; }
  .double-badge { font-weight: 700; color: #d9534f; font-size: clamp(0.6rem, 1.4vmin, 0.85rem); }
  .roll-btn { position: relative; overflow: hidden; font-size: clamp(0.75rem, 1.7vmin, 1rem); padding: 0.8vmin 2.2vmin; }
  .roll-btn .gauge { position: absolute; inset: 0; background: rgba(255,255,255,0.5); transform: scaleX(0); transform-origin: left; }
  .roll-btn.rolling .gauge { animation: gaugeFill 0.72s linear; }
  @keyframes gaugeFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .roll-btn .roll-label { position: relative; }

  /* ---------- 조 로스터 (컴팩트 카드) ---------- */
  .team-roster { flex: 0 0 20%; max-width: 20%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 0.6vh; padding-right: 0.2vw; }
  .team-card {
    background: var(--team-light, var(--card-bg)); border: 2px solid var(--team-color, #E9DFCE); border-radius: 14px;
    padding: 0.6vh 0.7vw; flex: 0 0 auto;
  }
  .team-card-head { display: flex; align-items: center; gap: 0.3rem; font-weight: 800; font-size: clamp(0.7rem, 1.3vw, 0.9rem); margin-bottom: 0.1rem; }
  .team-emoji { font-size: clamp(0.9rem, 1.7vw, 1.15rem); }
  .exile-badge { margin-left: auto; background: #D7D0F0; border-radius: 999px; padding: 0.1rem 0.4rem; font-size: 0.65rem; }
  .team-money { font-weight: 800; font-size: clamp(0.78rem, 1.5vw, 0.98rem); color: var(--board-text); }
  .team-meta { font-size: clamp(0.6rem, 1.1vw, 0.72rem); color: var(--text-soft); }

  /* ---------- 모달 ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(90,70,50,0.35); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 1rem; }
  .modal-card { background: var(--card-bg); border-radius: 24px; padding: 1.6rem; max-width: 420px; width: 100%; max-height: 88vh; overflow-y: auto; text-align: center; box-shadow: 0 20px 44px rgba(90,70,50,0.3); }
  .modal-emoji { font-size: 2.1rem; margin-bottom: 0.3rem; }
  .modal-card h3 { margin: 0 0 0.7rem; font-size: 1.1rem; }
  .modal-body { line-height: 1.55; margin-bottom: 0.9rem; font-size: 0.92rem; }
  .quiz-answer { color: var(--mint-deep); font-weight: 700; }
  .warn { color: #d9534f; font-weight: 700; }
  .modal-extra { margin-bottom: 0.9rem; }
  .teleport-select { padding: 0.55rem 0.9rem; border-radius: 14px; border: 2px solid #E9DFCE; width: 100%; margin-bottom: 0.6rem; }
  .olympic-mult-row { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

  /* ---------- 선생님 제어판 ---------- */
  .side-panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(340px, 92vw); background: var(--card-bg); box-shadow: -10px 0 30px rgba(90,70,50,0.2); z-index: 250; padding: 1.4rem; overflow-y: auto; }
  .side-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .icon-close { background: var(--beige); border-radius: 50%; width: 30px; height: 30px; font-size: 0.95rem; }
  .teacher-section { background: var(--cream); border-radius: 18px; padding: 0.9rem 1rem; margin-bottom: 0.9rem; }
  .teacher-section label { display: block; font-weight: 700; font-size: 0.82rem; margin: 0.5rem 0 0.25rem; }
  .teacher-section select, .teacher-section input { width: 100%; padding: 0.55rem 0.75rem; border-radius: 12px; border: 2px solid #E9DFCE; font-size: 0.9rem; }
  .teacher-btn-row { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  .teacher-btn-row button { flex: 1; }
  .teacher-catch-btn { line-height: 1.5; }
  .teacher-catch-btn .sub { font-size: 0.68rem; font-weight: 400; opacity: 0.85; }
  .fund-info { font-weight: 700; text-align: center; }

  /* ---------- 경고 배너 ---------- */
  .warning-banner {
    position: fixed; top: 1.5vh; left: 50%; transform: translate(-50%, -140%); z-index: 400;
    background: linear-gradient(135deg, #FF9E8F, #FFD97A); color: #6b2f14; font-weight: 700;
    padding: 0.8rem 1.6rem; border-radius: 999px; box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    font-size: clamp(0.75rem, 1.8vw, 1rem); transition: transform 0.35s ease; text-align: center; max-width: 90vw;
  }
  .warning-banner.show { transform: translate(-50%, 0); }

  /* ---------- 땅 & 문제 편집기 ---------- */
  .editor-overlay { position: fixed; inset: 0; background: rgba(90,70,50,0.4); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .editor-card {
    background: var(--card-bg); border-radius: 24px; width: min(760px, 96vw); max-height: 92vh;
    display: flex; flex-direction: column; box-shadow: 0 24px 50px rgba(90,70,50,0.35);
  }
  .editor-head { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 1.4rem 0.6rem; }
  .editor-head h3 { margin: 0; font-size: 1.15rem; }
  .editor-toolbar { display: flex; gap: 0.5rem; padding: 0 1.4rem 0.8rem; flex-wrap: wrap; }
  .file-label { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
  .hidden-file-input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .editor-list { overflow-y: auto; padding: 0 1.4rem 1rem; flex: 1 1 auto; display: flex; flex-direction: column; gap: 0.8rem; }
  .editor-item { background: var(--cream); border: 2px solid #E9DFCE; border-radius: 16px; padding: 0.8rem 1rem; text-align: left; }
  .editor-item-head { font-weight: 800; font-size: 0.85rem; color: var(--text-soft); margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.5rem; }
  .editor-tag { background: var(--pink); color: #7a3a55; border-radius: 999px; padding: 0.1rem 0.6rem; font-size: 0.7rem; }
  .editor-item label { display: block; font-weight: 700; font-size: 0.75rem; margin: 0.4rem 0 0.2rem; color: var(--text-soft); }
  .editor-item input, .editor-item textarea {
    width: 100%; padding: 0.5rem 0.7rem; border-radius: 10px; border: 2px solid #E9DFCE; font-size: 0.88rem; resize: vertical;
  }
  .editor-item textarea { min-height: 2.4rem; }
  .editor-footer { padding: 0.8rem 1.4rem 1.2rem; }
</style>
</head>
<body>

  <!-- ============ 시작 화면 ============ -->
  <div class="setup-overlay" id="setup-overlay">
    <div class="setup-card">
      <h1>🎡 국어 모두의 마블</h1>
      <p>고등학교 국어 수업용 보드게임 (아이패드 최적화)</p>
      <p class="setup-label">참여할 조 수를 선택하세요</p>
      <div class="setup-team-count" id="setup-team-count">
        <button class="count-btn" data-count="5">5개 조</button>
        <button class="count-btn selected" data-count="6">6개 조</button>
      </div>
      <div class="setup-row">
        <label>최대 턴 수</label>
        <input type="number" id="setup-maxturns" value="30" min="5" step="1" />
      </div>
      <div class="setup-row">
        <label>제한 시간(분)</label>
        <input type="number" id="setup-timelimit" value="30" min="5" step="1" />
      </div>
      <button id="start-game-btn" class="btn-primary btn-big">🚀 게임 시작하기</button>
    </div>
  </div>

  <!-- ============ 메인 앱 ============ -->
  <div id="app" class="hidden">
    <div class="app-header">
      <h1 class="app-title">🎡 국어 모두의 마블</h1>
      <div class="header-stats">
        <span class="stat-badge" id="turn-counter">턴 0/30</span>
        <span class="stat-badge" id="time-display">⏱ 30:00</span>
      </div>
      <button class="teacher-btn" id="teacher-btn">⚙️</button>
    </div>

    <div class="main-area">
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="board-center">
          <div class="center-title">국어 모두의 마블</div>
          <div class="turn-indicator" id="turn-indicator">-</div>
          <div class="fund-line" id="fund-line">💰 환곡: 0골드</div>
          <div class="olympic-line" id="olympic-line">🎪 축제 없음</div>
          <div class="dice-row">
            <span class="die" id="dice1">⚀</span>
            <span class="die" id="dice2">⚀</span>
          </div>
          <div class="double-badge hidden" id="double-badge"></div>
          <button id="roll-btn" class="btn-primary roll-btn">
            <span class="gauge" id="gauge"></span>
            <span class="roll-label">🎲 주사위 굴리기</span>
          </button>
        </div>
      </div>

      <div class="team-roster" id="team-roster"></div>
    </div>
  </div>

  <!-- ============ 선생님 제어판 ============ -->
  <div class="side-panel hidden" id="teacher-panel">
    <div class="side-panel-head">
      <h3>👩‍🏫 선생님 제어판</h3>
      <button class="icon-close" id="teacher-close">✕</button>
    </div>
    <div class="teacher-section">
      <label>조 선택</label>
      <select id="teacher-team-select"></select>
      <label>금액 (골드)</label>
      <input type="number" id="teacher-amount" value="10000" step="10000" min="0" />
      <div class="teacher-btn-row">
        <button id="teacher-pay" class="btn-primary btn-small">💸 지급</button>
        <button id="teacher-deduct" class="btn-secondary btn-small">➖ 차감</button>
      </div>
    </div>
    <div class="teacher-section">
      <button id="teacher-catch" class="btn-danger btn-block teacher-catch-btn">
        🚨 외래어/영어 사용 적발!<br />
        <span class="sub">(현재 턴 조에서 5만 골드 차감 → 환곡에 적립)</span>
      </button>
    </div>
    <div class="teacher-section fund-info">
      💰 누적 환곡: <strong id="teacher-fund-display">0골드</strong>
    </div>
    <div class="teacher-section">
      <button id="open-editor-btn" class="btn-secondary btn-block">📝 땅 &amp; 문제 편집기 열기</button>
    </div>
  </div>

  <!-- ============ 땅 & 문제 편집기 ============ -->
  <div class="editor-overlay hidden" id="editor-overlay">
    <div class="editor-card">
      <div class="editor-head">
        <h3>📝 땅 &amp; 문제 편집기</h3>
        <button class="icon-close" id="editor-close">✕</button>
      </div>
      <div class="editor-toolbar">
        <button id="editor-export" class="btn-secondary btn-small">⬇️ JSON 다운로드</button>
        <label class="btn-secondary btn-small file-label">⬆️ JSON 불러오기<input type="file" id="editor-import" class="hidden-file-input" accept="application/json" /></label>
      </div>
      <div class="editor-list" id="editor-list"></div>
      <div class="editor-footer">
        <button id="editor-apply" class="btn-primary btn-block">💾 변경사항 적용</button>
      </div>
    </div>
  </div>

  <!-- ============ 경고 배너 ============ -->
  <div class="warning-banner" id="warning-banner"></div>

  <!-- ============ 공용 모달 ============ -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji"></div>
      <h3 id="modal-title"></h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-extra" id="modal-extra"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

<script>
  // ============================================================
  // 컬러 그룹 (선생님이 수정하는 곳 1/2)
  // ============================================================
  const COLOR_GROUPS = {
    seojeong: { label: "서정시", color: "#FFADAD" },
    geundae:  { label: "근대소설", color: "#A0C4FF" },
    jeohang:  { label: "저항시", color: "#CAFFBF" },
    gojeon:   { label: "고전소설", color: "#BDB2FF" },
    hyangto:  { label: "향토문학", color: "#FDFFB6" },
    pansori:  { label: "판소리계문학", color: "#9BF6FF" },
    supil:    { label: "수필기행", color: "#FFD6A5" },
    hyeondae: { label: "현대시", color: "#FFC6FF" },
  };
  const SIDE_LABELS = { top: "상단", right: "우측", bottom: "하단", left: "좌측" };

  // ============================================================
  // 보드 데이터 (선생님이 수정하는 곳 2/2)
  // 땅 이름 / 컬러그룹(group) / 가격(price) / 퀴즈(question, answer)를
  // 자유롭게 바꿀 수 있습니다. type과 side, id는 보드 구조와 연결되어
  // 있으니 되도록 유지해주세요.
  // ============================================================
  const boardData = [
    { id: 0,  name: "집현전",              type: "start",   emoji: "🏯" },
    { id: 1,  name: "윤동주 서시 언덕",     type: "land",    emoji: "🌌", group: "seojeong", side: "top",

      el.style.gridColumn = cell.col;

          el.style.background = teams[sq.owner].color;
          el.classList.add("owned");

        } else {
          el.style.background = COLOR_GROUPS[sq.group].color;
        }
      }

      const tokensHere = teams.filter((t) => t.position === idx);
      const isProperty = sq.type === "land" || sq.type === "tourist";
      const priceLabel = isProperty
        ? (sq.owner !== null ? (BUILD_ICON[sq.buildingTier] || "") : Math.round(sq.price / 10000) + "만")
        : "";

      el.innerHTML = `
        ${sq.type === "tourist" ? `<span class="sq-star">⭐</span>` : ""}

      olympicLineEl.textContent = "🎪 축제 없음";
    } else {
      const sq = boardData.find((s) => s.id === festival.landId);
      olympicLineEl.textContent = `🎪 ${sq ? sq.name : ""} 통행료 ×${festival.multiplier}`;
    }
  }

  function renderTeacherSelect() {
    teacherTeamSelectEl.innerHTML = teams.map((t) => `<option value="${t.id}">${t.emoji} ${t.name}</option>`).join("");
  }

  function showWarning(message) {
    warningBannerEl.textContent = message;
    warningBannerEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => warningBannerEl.classList.remove("show"), 4500);
  }
</script>
<script>
  // ============================================================
  // 주사위 & 이동
  // ============================================================
  rollBtn.addEventListener("click", rollDice);

  function rollDice() {
    if (isMoving || !gameStarted || gameEnded) return;
    const team = teams[currentTeamIndex];
    if (team.exileTurnsLeft > 0) { openExileModal(team); return; }

    isMoving = true;
    rollBtn.disabled = true;
    doubleBadgeEl.classList.add("hidden");
    rollBtn.classList.add("rolling");

    let flickers = 0;
    const flickerTimer = setInterval(() => {
      dice1El.textContent = DICE_FACES[Math.floor(Math.random() * 6) + 1];
      dice2El.textContent = DICE_FACES[Math.floor(Math.random() * 6) + 1];
      flickers++;
      if (flickers > 8) {
        clearInterval(flickerTimer);
        rollBtn.classList.remove("rolling");
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        dice1El.textContent = DICE_FACES[d1];
        dice2El.textContent = DICE_FACES[d2];

        lastRollWasDouble = d1 === d2;
        team.consecutiveDoubles = lastRollWasDouble ? (team.consecutiveDoubles || 0) + 1 : 0;

        if (team.consecutiveDoubles >= 3) {
          isMoving = false;
          imprisonTeam(team, true);
          return;
        }
        moveToken(team, d1 + d2);
      }
    }, 80);
  }

  function moveToken(team, steps) {
    let moved = 0;
    const moveTimer = setInterval(() => {
      team.position = (team.position + 1) % boardData.length;
      if (team.position === 0) team.lapsCompleted = (team.lapsCompleted || 0) + 1;
      renderBoard();
      moved++;
      if (moved >= steps) {
        clearInterval(moveTimer);
        isMoving = false;
        handleLanding(team);
      }
    }, 150);
  }

  function advanceTurn(extraRoll) {
    if (gameEnded) return;
    if (extraRoll) {
      doubleBadgeEl.textContent = "🎲 더블! 한 번 더 굴리세요!";
      doubleBadgeEl.classList.remove("hidden");
      rollBtn.disabled = false;
      return;
    }
    doubleBadgeEl.classList.add("hidden");
    teams[currentTeamIndex].consecutiveDoubles = 0;
    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
    turnCount++;
    updateTurnCounterDisplay();
    if (turnCount >= maxTurns) { endGameByLimit("제한 턴에 도달했습니다!"); return; }
    dice1El.textContent = "⚀";
    dice2El.textContent = "⚀";
    rollBtn.disabled = false;
    updateTurnIndicator();
    renderTeamCards();
  }
</script>
<script>
  // ============================================================
  // 칸 도착 처리
  // ============================================================
  function handleLanding(team) {
    const sq = boardData[team.position];
    switch (sq.type) {
      case "start": onLandStart(team); break;
      case "exile": imprisonTeam(team, false); break;
      case "olympic": onLandOlympic(team); break;
      case "travel": onLandTravel(team); break;
      case "land": case "tourist": onLandProperty(team, sq); break;
    }
  }

  function onLandStart(team) {
    openModal({
      emoji: "🏯", title: "집현전",
      body: `${team.name}, 출발점 집현전으로 돌아왔습니다!`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
    });
  }

  function imprisonTeam(team, viaDoubles) {
    team.position = 7;
    team.exileTurnsLeft = 3;
    team.consecutiveDoubles = 0;
    renderBoard();
    openModal({
      emoji: "🏝️", title: "무인도",
      body: viaDoubles
        ? `${team.name}, 더블을 3번 연속 굴려서 무인도로 유배되었습니다!`
        : `${team.name}, 무인도에 도착했습니다. 3턴 동안 갇히게 돼요!`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(false); } }],
    });
  }

  function onLandOlympic(team) {
    const ownedCells = boardData.filter((s) => (s.type === "land" || s.type === "tourist") && s.owner !== null);
    if (ownedCells.length === 0) {
      openModal({
        emoji: "🎪", title: "올림픽",
        body: "아직 축제를 적용할 소유된 땅이 없어요. 다음 기회에!",
        buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
      });
      return;
    }
    const options = ownedCells.map((s) => `<option value="${s.id}">${s.name} (${teams[s.owner].name})</option>`).join("");
    openModal({
      emoji: "🎪", title: "올림픽 개최!",
      body: "축제를 적용할 땅과 배율을 선택하세요. 그 땅의 통행료가 배율만큼 오릅니다.",
      customHTML: `<select id="olympic-select" class="teleport-select">${options}</select>
        <div class="olympic-mult-row">
          <button class="btn-secondary btn-small" data-m="2">×2</button>
          <button class="btn-secondary btn-small" data-m="3">×3</button>
          <button class="btn-secondary btn-small" data-m="4">×4</button>
          <button class="btn-secondary btn-small" data-m="5">×5</button>
        </div>`,
      buttons: [{ label: "닫기", className: "btn-secondary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
    });
    document.querySelectorAll(".olympic-mult-row button").forEach((btn) => {
      btn.addEventListener("click", () => {
        const landId = Number(document.getElementById("olympic-select").value);
        const mult = Number(btn.dataset.m);
        festival = { landId, multiplier: mult };
        updateFestivalDisplay();
        closeModal();
        advanceTurn(lastRollWasDouble);
      });
    });
  }

  function onLandTravel(team) {
    if (team.money < TRAVEL_FEE) {
      openModal({
        emoji: "🎡", title: "세계여행",
        body: `이동비 ${TRAVEL_FEE.toLocaleString()}골드가 부족해요. 이번 칸에 머무릅니다.`,
        buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
      });
      return;
    }
    const options = boardData.filter((s) => s.id !== 21).map((s) => `<option value="${s.id}">${s.name}</option>`).join("");
    openModal({
      emoji: "🎡", title: "세계여행",
      body: `가마를 타고 이동비 ${TRAVEL_FEE.toLocaleString()}골드를 낸 뒤 원하는 곳으로 이동하세요!`,
      customHTML: `<select id="travel-select" class="teleport-select">${options}</select>`,
      buttons: [{
        label: "이동하기", className: "btn-primary",
        onClick: () => {
          const dest = Number(document.getElementById("travel-select").value);
          team.money -= TRAVEL_FEE;
          team.position = dest;
          renderTeamCards();
          closeModal();
          renderBoard();
          handleLanding(team);
        },
      }],
    });
  }
</script>
<script>
  // ============================================================
  // 땅 도착 처리 (구매 / 건설 / 통행료 / 인수)
  // ============================================================
  function onLandProperty(team, sq) {
    if (sq.owner === null) {
      openPropertyQuizModal(team, sq, "buy");
    } else if (sq.owner === team.id) {
      const nextTier = getNextBuildableTier(team, sq);
      if (nextTier === null) {
        openModal({
          emoji: sq.emoji || "🏠", title: sq.name,
          body: `${team.name}의 땅이에요. 지금은 더 건설할 수 있는 단계가 없어요.`,
          buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
        });
      } else {
        openPropertyQuizModal(team, sq, "build");
      }
    } else {
      offerTollOrAcquire(team, sq);
    }
  }

  function getNextBuildableTier(team, sq) {
    const tier = sq.buildingTier || 0;
    if (tier === 0) return 1;
    if (tier === 1) return team.lapsCompleted >= 1 ? 2 : null;
    if (tier === 2) return team.lapsCompleted >= 2 ? 3 : null;
    if (tier === 3) {
      if (sq.type !== "land") return null;
      return isGroupAllAtTier(sq.group, team.id, 3) ? 4 : null;
    }
    return null;
  }

  function getBuildCost(sq, tier) {
    return Math.round((sq.price * BUILD_MULT[tier]) / 1000) * 1000;
  }

  function openPropertyQuizModal(team, sq, mode) {
    openModal({
      emoji: sq.emoji || "🏠", title: sq.name,
      body: `<strong>Q.</strong> ${sq.question}`,
      buttons: [{ label: "정답 확인", className: "btn-primary", onClick: () => showPropertyAnswerStage(team, sq, mode) }],
    });
  }

  function showPropertyAnswerStage(team, sq, mode) {
    openModal({
      emoji: sq.emoji || "🏠", title: sq.name,
      body: `<strong>Q.</strong> ${sq.question}<br><br><span class="quiz-answer">정답: ${sq.answer}</span>` +
        (sq.explanation ? `<br><small>${sq.explanation}</small>` : "") +
        `<br>실제로 맞혔나요?`,
      buttons: [
        { label: "✅ 정답이었어요", className: "btn-primary", onClick: () => (mode === "buy" ? showBuyDecision(team, sq) : showBuildDecision(team, sq)) },
        { label: "❌ 오답이었어요", className: "btn-secondary", onClick: () => handlePropertyWrongAnswer(team, sq) },
      ],
    });
  }

  function handlePropertyWrongAnswer(team, sq) {
    const penalty = Math.round(((sq.price || 100000) * WRONG_PENALTY_RATE) / 1000) * 1000;
    team.money = Math.max(0, team.money - penalty);
    fund += penalty;
    renderTeamCards(); updateFundDisplay();
    openModal({
      emoji: "😢", title: "아쉬워요!",
      body: `오답이었어요. 벌금 ${penalty.toLocaleString()}골드가 환곡에 쌓였습니다.`,
      buttons: [{ label: "다음 턴으로", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
    });
  }

  function showBuyDecision(team, sq) {
    const affordable = team.money >= sq.price;
    const buttons = [];
    if (affordable) {
      buttons.push({
        label: "구매하기 🎉", className: "btn-primary",
        onClick: () => {
          team.money -= sq.price;
          sq.owner = team.id;
          team.lands.push(sq.id);
          renderAll();
          closeModal();
          checkMonopolyWin(team);
          if (!gameEnded) advanceTurn(lastRollWasDouble);
        },
      });
    }
    buttons.push({ label: affordable ? "그냥 넘어가기" : "아쉽지만 넘어가기", className: "btn-secondary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } });
    openModal({
      emoji: "🎉", title: "정답입니다!",
      body: `이 땅 <strong>${sq.name}</strong>을(를) ${sq.price.toLocaleString()}골드에 구매하시겠어요?` + (affordable ? "" : `<br><span class="warn">보유 골드가 부족해서 구매할 수 없어요.</span>`),
      buttons,
    });
  }

  function showBuildDecision(team, sq) {
    const nextTier = getNextBuildableTier(team, sq);
    if (nextTier === null) {
      openModal({
        emoji: "🏠", title: sq.name, body: "지금은 건설할 수 있는 단계가 없어요.",
        buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } }],
      });
      return;
    }
    const cost = getBuildCost(sq, nextTier);
    const tierName = TIER_NAMES[nextTier];
    const affordable = team.money >= cost;
    const buttons = [];
    if (affordable) {
      buttons.push({
        label: `${tierName} 건설하기 🏗️`, className: "btn-primary",
        onClick: () => {
          team.money -= cost;
          sq.buildingTier = nextTier;
          sq.investedBuildingCost = (sq.investedBuildingCost || 0) + cost;
          renderAll();
          closeModal();
          advanceTurn(lastRollWasDouble);
        },
      });
    }
    buttons.push({ label: affordable ? "다음에 건설하기" : "아쉽지만 다음에", className: "btn-secondary", onClick: () => { closeModal(); advanceTurn(lastRollWasDouble); } });
    openModal({
      emoji: "🏗️", title: "정답입니다! 건설 기회!",
      body: `<strong>${sq.name}</strong>에 <strong>${tierName}</strong>을(를) ${cost.toLocaleString()}골드에 건설하시겠어요?` + (affordable ? "" : `<br><span class="warn">보유 골드가 부족해요.</span>`),
      buttons,
    });
  }

  function offerTollOrAcquire(team, sq) {
    const owner = teams[sq.owner];
    const tier = sq.buildingTier || 0;
    const groupFull = sq.type === "land" && isGroupFullyOwned(sq.group, sq.owner);
    let toll = Math.round((sq.price * TOLL_RATE[tier]) / 1000) * 1000;
    if (tier === 0 && groupFull) toll *= 2;
    if (festival.landId === sq.id) toll = Math.round(toll * festival.multiplier);

    const canAcquire = !(sq.type === "tourist" || tier === 4);
    const acquireCost = Math.round((2 * (sq.price + (sq.investedBuildingCost || 0))) / 1000) * 1000;

    const buttons = [{
      label: `통행료 내기 (${toll.toLocaleString()}골드)`, className: "btn-primary",
      onClick: () => {
        team.money = Math.max(0, team.money - toll);
        owner.money += toll;
        renderTeamCards();
        closeModal();
        advanceTurn(lastRollWasDouble);
      },
    }];
    if (canAcquire && team.money >= acquireCost) {
      buttons.push({
        label: `인수하기 (${acquireCost.toLocaleString()}골드)`, className: "btn-secondary",
        onClick: () => {
          team.money -= acquireCost;
          owner.money += acquireCost;
          owner.lands = owner.lands.filter((id) => id !== sq.id);
          sq.owner = team.id;
          team.lands.push(sq.id);
          renderAll();
          closeModal();
          checkMonopolyWin(team);
          if (!gameEnded) advanceTurn(lastRollWasDouble);
        },
      });
    }
    openModal({
      emoji: sq.emoji || "🏠", title: sq.name,
      body: `앗, ${owner.name}의 땅(${TIER_NAMES[tier]})이에요!` + (canAcquire ? "" : `<br><span class="warn">이 땅은 인수할 수 없어요.</span>`),
      buttons,
    });
  }
</script>
<script>
  // ============================================================
  // 무인도 탈출
  // ============================================================
  function openExileModal(team) {

        onClick: () => {
          team.money -= EXILE_ESCAPE_FEE;
          fund += EXILE_ESCAPE_FEE;

          closeModal();
          openModal({
            emoji: "🎉", title: "탈출 성공!", body: `${team.name}, 무인도에서 탈출했습니다!`,
            buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(false); } }],

          const msg = team.exileTurnsLeft > 0 ? `실패했어요. 남은 턴: ${team.exileTurnsLeft}` : `실패했지만 3턴이 지나 자동으로 풀려났습니다!`;
          openModal({

              (q.explanation ? `<br><small>${q.explanation}</small>` : "") +
              `<br>실제로 맞혔나요?`,

                  closeModal();
                  openModal({
                    emoji: "🎉", title: "탈출 성공!", body: `${team.name}, 퀴즈를 맞히고 탈출했습니다!`,
                    buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); advanceTurn(false); } }],

              {
                label: "❌ 오답이었어요", className: "btn-secondary",

<script>
  // ============================================================
  // 독점 승리 판정
  // ============================================================
  function getGroupKeys() { return Object.keys(COLOR_GROUPS); }

  function isGroupFullyOwned(groupKey, teamId) {
    const cells = boardData.filter((s) => s.group === groupKey);
    return cells.length > 0 && cells.every((s) => s.owner === teamId);
  }
  function isLineFullyOwned(side, teamId) {
    const cells = boardData.filter((s) => s.side === side);
    return cells.length > 0 && cells.every((s) => s.owner === teamId);
  }
  function isGroupAllAtTier(groupKey, teamId, tier) {
    const cells = boardData.filter((s) => s.group === groupKey);
    return cells.length > 0 && cells.every((s) => s.owner === teamId && (s.buildingTier || 0) >= tier);
  }
  function missingCountForSet(cellIds, teamId) {
    return cellIds.filter((id) => boardData.find((s) => s.id === id).owner !== teamId).length;
  }

  function checkMonopolyWin(team) {
    if (gameEnded) return;
    const groupKeys = getGroupKeys();
    const sides = ["top", "right", "bottom", "left"];
    const touristIds = boardData.filter((s) => s.type === "tourist").map((s) => s.id);

    const completeGroups = groupKeys.filter((g) => isGroupFullyOwned(g, team.id));
    const completeLines = sides.filter((s) => isLineFullyOwned(s, team.id));
    const hasTourist = touristIds.length > 0 && touristIds.every((id) => boardData.find((s) => s.id === id).owner === team.id);
    const hasTriple = completeGroups.length >= 3;
    const hasLine = completeLines.length >= 1;

    let result = null;
    if (hasLine && hasTourist) result = { label: "믹스 독점 (라인×관광지)", mult: 9 };
    else if (hasTriple && hasLine) result = { label: "믹스 독점 (트리플×라인)", mult: 7 };
    else if (hasTourist) result = { label: "관광지 독점", mult: 5 };
    else if (hasLine) result = { label: "라인 독점", mult: 3 };
    else if (hasTriple) result = { label: "트리플 독점", mult: 2 };

    if (result) {
      triggerMonopolyWin(team, result);
    } else {
      checkNearMonopoly(team, groupKeys, sides, touristIds);
    }
  }

  function checkNearMonopoly(team, groupKeys, sides, touristIds) {
    for (const g of groupKeys) {
      const ids = boardData.filter((s) => s.group === g).map((s) => s.id);
      if (missingCountForSet(ids, team.id) === 1) {
        showWarning(`⚠️ 독점 위기 경고! ${team.name}, ${COLOR_GROUPS[g].label} 독점까지 땅 1칸 남았어요!`);
        return;
      }
    }
    for (const side of sides) {
      const ids = boardData.filter((s) => s.side === side).map((s) => s.id);
      if (missingCountForSet(ids, team.id) === 1) {
        showWarning(`⚠️ 독점 위기 경고! ${team.name}, ${SIDE_LABELS[side]} 라인 독점까지 땅 1칸 남았어요!`);
        return;
      }
    }
    if (touristIds.length > 0 && missingCountForSet(touristIds, team.id) === 1) {
      showWarning(`⚠️ 독점 위기 경고! ${team.name}, 관광지 독점까지 땅 1칸 남았어요!`);
    }
  }

  function triggerMonopolyWin(team, result) {
    gameEnded = true;
    clearInterval(timerInterval);
    rollBtn.disabled = true;
    openModal({
      emoji: "🏆", title: "⚡ 독점 승리! ⚡",
      body: `${team.emoji} ${team.name}, <strong>${result.label}</strong>을(를) 달성했습니다!<br>보상 배율: <strong>${result.mult}배</strong><br><br>게임이 종료되었습니다! 🎉`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
    });
  }

  function computeTotalAssets(team) {
    let total = team.money;
    team.lands.forEach((id) => {
      const sq = boardData.find((s) => s.id === id);
      total += sq.price + (sq.investedBuildingCost || 0);
    });
    return total;
  }

  function endGameByLimit(reason) {
    if (gameEnded) return;
    gameEnded = true;
    clearInterval(timerInterval);
    rollBtn.disabled = true;
    const ranked = teams.map((t) => ({ t, totalAssets: computeTotalAssets(t) })).sort((a, b) => b.totalAssets - a.totalAssets);
    const winner = ranked[0].t;
    const listHtml = ranked.map((r, i) => `${i + 1}위 ${r.t.emoji} ${r.t.name}: ${r.totalAssets.toLocaleString()}골드`).join("<br>");
    openModal({
      emoji: "🏆", title: "게임 종료!",
      body: `${reason}<br><br>${listHtml}<br><br><strong>${winner.emoji} ${winner.name} 우승!</strong>`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
    });
  }
</script>
<script>
  // ============================================================
  // 선생님 제어판
  // ============================================================
  const teacherBtn = document.getElementById("teacher-btn");
  const teacherPanel = document.getElementById("teacher-panel");
  const teacherClose = document.getElementById("teacher-close");
  const teacherAmountInput = document.getElementById("teacher-amount");

  teacherBtn.addEventListener("click", () => teacherPanel.classList.remove("hidden"));
  teacherClose.addEventListener("click", () => teacherPanel.classList.add("hidden"));

  document.getElementById("teacher-pay").addEventListener("click", () => {
    if (!gameStarted) return;
    const idx = Number(teacherTeamSelectEl.value);
    const amount = Number(teacherAmountInput.value) || 0;
    teams[idx].money += amount;
    renderTeamCards();
  });

  document.getElementById("teacher-deduct").addEventListener("click", () => {
    if (!gameStarted) return;
    const idx = Number(teacherTeamSelectEl.value);
    const amount = Number(teacherAmountInput.value) || 0;
    teams[idx].money = Math.max(0, teams[idx].money - amount);
    renderTeamCards();
  });

  document.getElementById("teacher-catch").addEventListener("click", () => {
    if (!gameStarted || gameEnded || teams.length === 0) return;
    const team = teams[currentTeamIndex];
    team.money = Math.max(0, team.money - CATCH_PENALTY);
    fund += CATCH_PENALTY;
    renderTeamCards(); updateFundDisplay();
    openModal({
      emoji: "🚨", title: "외래어 사용 적발!",
      body: `${team.name}, 우리말 대신 외래어를 사용했네요! 벌금 ${CATCH_PENALTY.toLocaleString()}골드가 환곡에 쌓였습니다.`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
    });
  });

  // ============================================================
  // 공용 모달
  // ============================================================
  function openModal({ emoji = "", title = "", body = "", customHTML = "", buttons = [] }) {
    modalEmojiEl.textContent = emoji;
    modalTitleEl.textContent = title;
    modalBodyEl.innerHTML = body;
    modalExtraEl.innerHTML = customHTML;
    modalActionsEl.innerHTML = "";
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.className = b.className || "btn-primary";
      btn.textContent = b.label;
      btn.addEventListener("click", b.onClick);
      modalActionsEl.appendChild(btn);
    });
    modalOverlay.classList.remove("hidden");
  }
  function closeModal() { modalOverlay.classList.add("hidden"); }
</script>
<script>
  // ============================================================
  // 땅 & 문제 편집기
  // ============================================================
  const editorOverlay = document.getElementById("editor-overlay");
  const editorListEl = document.getElementById("editor-list");
  const openEditorBtn = document.getElementById("open-editor-btn");
  const editorCloseBtn = document.getElementById("editor-close");
  const editorApplyBtn = document.getElementById("editor-apply");
  const editorExportBtn = document.getElementById("editor-export");
  const editorImportInput = document.getElementById("editor-import");

  function editableCells() {
    return boardData.filter((s) => s.type === "land" || s.type === "tourist");
  }

  function openEditor() {
    teacherPanel.classList.add("hidden");
    renderEditorList();
    editorOverlay.classList.remove("hidden");
  }
  function closeEditor() { editorOverlay.classList.add("hidden"); }

  function renderEditorList() {
    editorListEl.innerHTML = editableCells().map((sq) => {
      const tag = sq.type === "tourist" ? "관광지" : COLOR_GROUPS[sq.group].label;
      return `
        <div class="editor-item" data-id="${sq.id}">
          <div class="editor-item-head">#${sq.id} <span class="editor-tag">${tag}</span></div>
          <label>땅 이름</label>
          <input type="text" class="ed-name" value="${escapeAttr(sq.name)}" />
          <label>기본 가격 (골드)</label>
          <input type="number" class="ed-price" value="${sq.price}" step="10000" min="0" />
          <label>퀴즈 문제</label>
          <textarea class="ed-question">${escapeHtml(sq.question || "")}</textarea>
          <label>정답</label>
          <input type="text" class="ed-answer" value="${escapeAttr(sq.answer || "")}" />
          <label>해설</label>
          <textarea class="ed-explanation">${escapeHtml(sq.explanation || "")}</textarea>
        </div>
      `;
    }).join("");
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function applyEditorChanges() {
    document.querySelectorAll(".editor-item").forEach((itemEl) => {
      const id = Number(itemEl.dataset.id);
      const sq = boardData.find((s) => s.id === id);
      if (!sq) return;
      sq.name = itemEl.querySelector(".ed-name").value.trim() || sq.name;
      sq.price = Number(itemEl.querySelector(".ed-price").value) || sq.price;
      sq.question = itemEl.querySelector(".ed-question").value.trim();
      sq.answer = itemEl.querySelector(".ed-answer").value.trim();
      sq.explanation = itemEl.querySelector(".ed-explanation").value.trim();
    });
    renderBoard();
    if (gameStarted) renderTeamCards();
    closeEditor();
  }

  function exportBoardJSON() {
    const data = editableCells().map((sq) => ({
      id: sq.id, name: sq.name, price: sq.price,
      question: sq.question || "", answer: sq.answer || "", explanation: sq.explanation || "",
    }));
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "gugeo-boardgame-questions.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importBoardJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error("배열 형식이 아니에요.");
        let updated = 0;
        data.forEach((item) => {
          const sq = boardData.find((s) => s.id === item.id && (s.type === "land" || s.type === "tourist"));
          if (!sq) return;
          if (typeof item.name === "string" && item.name.trim()) sq.name = item.name.trim();
          if (typeof item.price === "number" && item.price >= 0) sq.price = item.price;
          if (typeof item.question === "string") sq.question = item.question;
          if (typeof item.answer === "string") sq.answer = item.answer;
          if (typeof item.explanation === "string") sq.explanation = item.explanation;
          updated++;
        });
        renderEditorList();
        renderBoard();
        if (gameStarted) renderTeamCards();
        openModal({
          emoji: "✅", title: "불러오기 완료",
          body: `${updated}개 칸의 데이터를 불러왔어요. 확인 후 [변경사항 적용]을 눌러 목록에서 추가로 수정할 수도 있어요.`,
          buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
        });
      } catch (e) {
        openModal({
          emoji: "⚠️", title: "불러오기 실패",
          body: `JSON 파일을 읽는 중 문제가 발생했어요.<br><span class="warn">${e.message}</span>`,
          buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
        });
      }
    };
    reader.readAsText(file);
  }

  openEditorBtn.addEventListener("click", openEditor);
  editorCloseBtn.addEventListener("click", closeEditor);
  editorApplyBtn.addEventListener("click", applyEditorChanges);
  editorExportBtn.addEventListener("click", exportBoardJSON);
  editorImportInput.addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) importBoardJSON(file);
    editorImportInput.value = "";
  });
</script>
