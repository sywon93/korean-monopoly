<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>훈민정음 부루마블</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

  :root {
    --cream: #FFF8EF;
    --beige: #F3E7D6;
    --pink: #FFD9E8;
    --pink-deep: #FF9EBB;
    --mint: #CFF5E7;
    --mint-deep: #63C9A6;
    --text: #5A4632;
    --text-soft: #9A8871;
    --card-bg: #FFFEFB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--cream) 0%, var(--beige) 100%);
    font-family: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: var(--text);
    padding-bottom: 3rem;
  }

  .hidden { display: none !important; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  select, input {
    font-family: inherit;
  }

  /* ---------- 버튼 공통 ---------- */
  .btn-primary, .btn-secondary, .btn-danger {
    border-radius: 999px;
    font-weight: 700;
    padding: 0.7rem 1.4rem;
    font-size: 1rem;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--mint-deep), var(--mint));
    color: #2f5a48;
    box-shadow: 0 6px 14px rgba(99, 201, 166, 0.4);
  }
  .btn-secondary {
    background: var(--card-bg);
    color: var(--text-soft);
    border: 2px solid #E9DFCE;
  }
  .btn-danger {
    background: linear-gradient(135deg, #FF9E8F, #FFC2B4);
    color: #7a2e20;
    box-shadow: 0 6px 14px rgba(255, 142, 120, 0.4);
  }
  .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover {
    transform: translateY(-2px);
  }
  .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; }
  .btn-big { padding: 1rem 2.2rem; font-size: 1.2rem; }
  .btn-block { width: 100%; text-align: center; }

  /* ---------- 시작 화면 ---------- */
  .setup-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--cream) 0%, var(--pink) 120%);
    z-index: 50;
    padding: 1rem;
  }
  .setup-card {
    background: var(--card-bg);
    border-radius: 32px;
    padding: 3rem 2.5rem;
    text-align: center;
    box-shadow: 0 20px 40px rgba(180, 140, 110, 0.25);
    max-width: 420px;
    width: 100%;
  }
  .setup-card h1 { font-size: 1.8rem; margin: 0 0 0.4rem; }
  .setup-card p { color: var(--text-soft); margin: 0.2rem 0; }
  .setup-label { margin-top: 1.6rem; font-weight: 700; }
  .setup-team-count {
    display: flex;
    gap: 0.7rem;
    justify-content: center;
    margin: 1rem 0 1.8rem;
  }
  .count-btn {
    background: var(--card-bg);
    border: 2px solid #E9DFCE;
    border-radius: 16px;
    padding: 0.7rem 1.2rem;
    font-weight: 700;
    color: var(--text-soft);
  }
  .count-btn.selected {
    background: var(--pink);
    border-color: var(--pink-deep);
    color: #7a3a55;
  }

  /* ---------- 앱 헤더 ---------- */
  #app { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem; }

  .app-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
  }
  .app-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .app-title span { color: var(--pink-deep); }
  .fund-badge {
    background: var(--card-bg);
    border-radius: 999px;
    padding: 0.5rem 1.1rem;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(180, 140, 110, 0.15);
  }
  .teacher-btn {
    background: var(--pink);
    color: #7a3a55;
    border-radius: 999px;
    padding: 0.6rem 1.2rem;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(255, 158, 187, 0.4);
  }

  /* ---------- 메인 컨트롤 카드 ---------- */
  .main-controls {
    background: var(--card-bg);
    border-radius: 28px;
    box-shadow: 0 12px 26px rgba(180, 140, 110, 0.18);
    max-width: 480px;
    margin: 0 auto 1.6rem;
    padding: 1.6rem;
    text-align: center;
  }
  .turn-indicator {
    display: inline-block;
    padding: 0.5rem 1.4rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 1.1rem;
    border: 3px solid var(--pink-deep);
    background: var(--pink);
    margin-bottom: 1rem;
  }
  .dice-display {
    font-size: 4rem;
    line-height: 1;
    margin: 0.4rem 0 1rem;
  }
  .dice-display.rolling { animation: diceShake 0.08s linear infinite; }
  @keyframes diceShake {
    0% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.08); }
    100% { transform: rotate(-8deg) scale(1); }
  }
  #roll-btn { font-size: 1.3rem; padding: 1rem 2.4rem; }
  .catch-btn-wrap { margin-top: 1.2rem; }
  #catch-btn-main { width: 100%; }

  /* ---------- 보드판 ---------- */
  .board-wrap {
    position: relative;
    max-width: 700px;
    margin: 0 auto 2rem;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    aspect-ratio: 1;
    background: #FBE9D8;
    border-radius: 28px;
    padding: 10px;
    box-shadow: 0 14px 30px rgba(180, 140, 110, 0.2);
  }
  .square {
    border-radius: 16px;
    background: var(--card-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    text-align: center;
    padding: 2px;
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6);
    transition: background 0.3s;
    position: relative;
    overflow: hidden;
  }
  .square.type-start { background: var(--pink); }
  .square.type-prison { background: #D7D0F0; }
  .square.type-chance { background: #FFE9B8; }
  .square.type-teleport { background: #C9E7FF; }
  .square.type-fund { background: #FFD9A0; }
  .square.owned { box-shadow: inset 0 0 0 3px white, 0 4px 10px rgba(0,0,0,0.15); }
  .sq-emoji { font-size: 1.15rem; }
  .sq-name { font-size: 0.58rem; line-height: 1.1; }
  .sq-price { font-size: 0.55rem; color: var(--text-soft); }
  .sq-tokens { display: flex; gap: 1px; flex-wrap: wrap; justify-content: center; }
  .token { font-size: 0.85rem; }

  .board-center {
    position: absolute;
    top: 16.6%;
    left: 16.6%;
    width: 66.8%;
    height: 66.8%;
    background: var(--card-bg);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-shadow: inset 0 0 0 3px var(--pink);
  }
  .board-center-title {
    font-weight: 700;
    color: var(--pink-deep);
    font-size: 1.2rem;
    line-height: 1.5;
  }

  /* ---------- 조 카드 ---------- */
  .team-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
  }
  .team-card {
    background: var(--team-light, var(--card-bg));
    border: 2px solid var(--team-color, #E9DFCE);
    border-radius: 20px;
    padding: 1rem 1.1rem;
  }
  .team-card-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    margin-bottom: 0.3rem;
  }
  .team-emoji { font-size: 1.5rem; }
  .team-money { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.6rem; }
  .team-lands { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .land-chip {
    background: rgba(255,255,255,0.7);
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .land-chip.empty { color: var(--text-soft); font-weight: 400; }

  /* ---------- 모달 ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(90, 70, 50, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }
  .modal-card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 2rem;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 44px rgba(90, 70, 50, 0.3);
  }
  .modal-emoji { font-size: 2.4rem; margin-bottom: 0.4rem; }
  .modal-card h3 { margin: 0 0 0.8rem; font-size: 1.25rem; }
  .modal-body { line-height: 1.6; margin-bottom: 1rem; }
  .quiz-answer { color: var(--mint-deep); font-weight: 700; }
  .warn { color: #d9534f; font-weight: 700; }
  .modal-extra { margin-bottom: 1rem; }
  .teleport-select {
    padding: 0.6rem 1rem;
    border-radius: 14px;
    border: 2px solid #E9DFCE;
    width: 100%;
  }
  .modal-actions {
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  /* ---------- 선생님 제어판 ---------- */
  .side-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(360px, 92vw);
    background: var(--card-bg);
    box-shadow: -10px 0 30px rgba(90, 70, 50, 0.2);
    z-index: 90;
    padding: 1.6rem;
    overflow-y: auto;
  }
  .side-panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }
  .icon-close {
    background: var(--beige);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 1rem;
  }
  .teacher-section {
    background: var(--cream);
    border-radius: 20px;
    padding: 1rem 1.1rem;
    margin-bottom: 1rem;
  }
  .teacher-section label {
    display: block;
    font-weight: 700;
    font-size: 0.85rem;
    margin: 0.6rem 0 0.3rem;
  }
  .teacher-section select, .teacher-section input {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border-radius: 14px;
    border: 2px solid #E9DFCE;
    font-size: 0.95rem;
  }
  .teacher-btn-row { display: flex; gap: 0.6rem; margin-top: 0.8rem; }
  .teacher-btn-row button { flex: 1; }
  .teacher-catch-btn { line-height: 1.5; }
  .teacher-catch-btn .sub { font-size: 0.7rem; font-weight: 400; opacity: 0.85; }
  .fund-info { font-weight: 700; text-align: center; }

  @media (max-width: 520px) {
    .sq-name { font-size: 0.5rem; }
    .board-center-title { font-size: 0.9rem; }
    .dice-display { font-size: 3rem; }
  }
</style>
</head>
<body>

  <!-- ============ 시작 화면 ============ -->
  <div class="setup-overlay" id="setup-overlay">
    <div class="setup-card">
      <h1>🎎 훈민정음 부루마블</h1>
      <p>고등학교 국어 수업용 보드게임</p>
      <p class="setup-label">참여할 조 수를 선택하세요</p>
      <div class="setup-team-count" id="setup-team-count">
        <button class="count-btn" data-count="5">5개 조</button>
        <button class="count-btn selected" data-count="6">6개 조</button>
      </div>
      <button id="start-game-btn" class="btn-primary btn-big">🚀 게임 시작하기</button>
    </div>
  </div>

  <!-- ============ 메인 앱 ============ -->
  <div id="app" class="hidden">
    <div class="app-header">
      <h1 class="app-title">🎎 훈민정음 <span>부루마블</span></h1>
      <div class="fund-badge" id="fund-badge">💰 환곡: 0원</div>
      <button class="teacher-btn" id="teacher-btn">👩‍🏫 선생님 제어판</button>
    </div>

    <div class="main-controls">
      <div class="turn-indicator" id="turn-indicator">-</div>
      <div class="dice-display" id="dice-display">🎲</div>
      <button id="roll-btn" class="btn-primary">🎲 주사위 굴리기</button>
      <div class="catch-btn-wrap">
        <button id="catch-btn-main" class="btn-danger">🚫 영어/외래어 사용 적발!</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
      <div class="board-center">
        <div class="board-center-title">집현전<br />훈민정음 부루마블</div>
      </div>
    </div>

    <div class="team-cards" id="team-cards"></div>
  </div>

  <!-- ============ 선생님 제어판 ============ -->
  <div class="side-panel hidden" id="teacher-panel">
    <div class="side-panel-head">
      <h3>👩‍🏫 선생님 제어판</h3>
      <button class="icon-close" id="teacher-close">✕</button>
    </div>

    <div class="teacher-section">
      <label>조 선택</label>
      <select id="teacher-team-select"></select>
      <label>금액 (원)</label>
      <input type="number" id="teacher-amount" value="10000" step="10000" min="0" />
      <div class="teacher-btn-row">
        <button id="teacher-pay" class="btn-primary btn-small">💸 지급</button>
        <button id="teacher-deduct" class="btn-secondary btn-small">➖ 차감</button>
      </div>
    </div>

    <div class="teacher-section">
      <button id="teacher-catch" class="btn-danger btn-block teacher-catch-btn">
        🚫 영어/외래어 사용 적발!<br />
        <span class="sub">(현재 턴 조에서 5만원 차감 → 환곡에 적립)</span>
      </button>
    </div>

    <div class="teacher-section fund-info">
      💰 누적 환곡: <strong id="teacher-fund-display">0원</strong>
    </div>
  </div>

  <!-- ============ 공용 모달 ============ -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji"></div>
      <h3 id="modal-title"></h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-extra" id="modal-extra"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

<script>
  // ============================================================
  // 보드 데이터 (선생님이 직접 수정하는 곳)
  // 땅 이름, 가격, 문제, 정답을 자유롭게 바꿔서 사용하세요.
  // type: "start"(시작점) | "quiz"(문제칸) | "prison"(유배지) |
  //       "chance"(암행어사/황금열쇠) | "teleport"(축지법) | "fund"(환곡)
  // ============================================================
  const boardData = [
    { id: 0, name: "집현전", type: "start", emoji: "🏯" },
    { id: 1, name: "메밀꽃 봉평 장터", type: "quiz", emoji: "🌾", price: 100000,
      question: "이효석의 소설 '메밀꽃 필 무렵'의 배경이 되는 지역은 어디일까요?", answer: "봉평(평창)", owner: null },
    { id: 2, name: "별 헤는 밤 언덕", type: "quiz", emoji: "🌌", price: 110000,
      question: "시 '별 헤는 밤'을 쓴 시인은 누구일까요?", answer: "윤동주", owner: null },
    { id: 3, name: "청록파 산기슭", type: "quiz", emoji: "⛰️", price: 120000,
      question: "박목월, 박두진, 조지훈을 함께 부르는 시인 유파의 이름은?", answer: "청록파", owner: null },
    { id: 4, name: "시인의 언덕", type: "quiz", emoji: "🕊️", price: 130000,
      question: "윤동주의 유고 시집 제목은 무엇일까요?", answer: "하늘과 바람과 별과 시", owner: null },
    { id: 5, name: "유배지", type: "prison", emoji: "🏝️" },
    { id: 6, name: "진달래꽃 고개", type: "quiz", emoji: "🌸", price: 140000,
      question: "'나 보기가 역겨워 가실 때에는...'으로 시작하는 김소월의 시 제목은?", answer: "진달래꽃", owner: null },
    { id: 7, name: "봄봄 마름의 밭", type: "quiz", emoji: "🌱", price: 150000,
      question: "김유정의 소설 '봄봄'에서 '나'를 데릴사위로 부려먹는 인물은 누구일까요?", answer: "장인(봉필)", owner: null },
    { id: 8, name: "무진 갈대숲", type: "quiz", emoji: "🌫️", price: 160000,
      question: "김승옥의 소설 '무진기행'에서 무진을 상징하는 자연물은 무엇일까요?", answer: "안개", owner: null },
    { id: 9, name: "흥부네 박씨마을", type: "quiz", emoji: "🎋", price: 170000,
      question: "'흥부전'에서 흥부가 제비의 다리를 고쳐주고 받은 것은?", answer: "박씨", owner: null },
    { id: 10, name: "암행어사", type: "chance", emoji: "🔑" },
    { id: 11, name: "춘향골 광한루", type: "quiz", emoji: "🏮", price: 180000,
      question: "'춘향전'에서 이몽룡과 성춘향이 처음 만난 장소는 어디일까요?", answer: "광한루", owner: null },
    { id: 12, name: "심청이 인당수", type: "quiz", emoji: "🌊", price: 190000,
      question: "심청이 아버지의 눈을 뜨게 하려고 몸을 던진 바다의 이름은?", answer: "인당수", owner: null },
    { id: 13, name: "허생의 매점", type: "quiz", emoji: "🍎", price: 200000,
      question: "박지원의 '허생전'에서 허생이 사재기한 대표 물품은 무엇일까요?", answer: "과일(대추 등)", owner: null },
    { id: 14, name: "용비어천가 언덕", type: "quiz", emoji: "📜", price: 210000,
      question: "훈민정음으로 기록된 최초의 서사시로, 조선 왕조의 정당성을 노래한 작품은?", answer: "용비어천가", owner: null },
    { id: 15, name: "축지법", type: "teleport", emoji: "🌀" },
    { id: 16, name: "관동별곡 정자", type: "quiz", emoji: "⛩️", price: 220000,
      question: "정철이 강원도 관찰사로 부임하며 지은 가사 작품은 무엇일까요?", answer: "관동별곡", owner: null },
    { id: 17, name: "사미인곡 규방", type: "quiz", emoji: "🪞", price: 230000,
      question: "정철이 임금을 그리워하는 여인의 마음에 빗대어 쓴 가사 작품은?", answer: "사미인곡", owner: null },
    { id: 18, name: "훈민정음 반포마당", type: "quiz", emoji: "📖", price: 240000,
      question: "훈민정음을 창제하고 반포한 조선의 왕은 누구일까요?", answer: "세종대왕", owner: null },
    { id: 19, name: "환곡", type: "fund", emoji: "💰" },
  ];

  // 암행어사(황금열쇠) 칸에서 등장할 랜덤 이벤트
  const CHANCE_EVENTS = [
    { text: "암행어사 출두! 모범 답안 발표로 상금을 받았어요.", amount: 30000 },
    { text: "암행어사에게 걸려 벌금을 냈습니다.", amount: -20000 },
    { text: "길에서 엽전 주머니를 주웠습니다!", amount: 15000 },
    { text: "수라간 심부름 값을 치렀습니다...", amount: -15000 },
    { text: "백성들의 칭찬으로 상금을 받았어요!", amount: 25000 },
    { text: "암행어사의 매서운 눈초리에 벌금을 물었습니다.", amount: -10000 },
  ];

  // 조별 파스텔 테마 (1조~6조)
  const TEAM_PALETTE = [
    { color: "#FF9EAE", light: "#FFE1E6", emoji: "🐰" }, // 1조 파스텔레드
    { color: "#7FB3FF", light: "#DCEBFF", emoji: "🐻" }, // 2조 파스텔블루
    { color: "#5FCB9E", light: "#DFFBEF", emoji: "🐱" }, // 3조 파스텔민트
    { color: "#F2C14E", light: "#FFF3D2", emoji: "🐥" }, // 4조 파스텔옐로우
    { color: "#B79CFF", light: "#EBE0FF", emoji: "🐼" }, // 5조 파스텔퍼플
    { color: "#FF9E7A", light: "#FFE3D6", emoji: "🦊" }, // 6조 파스텔코랄
  ];

  const START_MONEY = 500000;
  const TOLL_RATE = 0.2;   // 다른 조 땅에 도착했을 때 통행료 비율
  const WRONG_RATE = 0.1;  // 오답 시 벌금 비율 (환곡으로 적립)
  const CATCH_PENALTY = 50000; // 외래어 적발 벌금

  // ---------------- 상태 ----------------
  let teams = [];
  let currentTeamIndex = 0;
  let fund = 0;
  let isMoving = false;
  let gameStarted = false;
  let teamCount = 6;

  const CELLS = buildPerimeterCells(6);
  function buildPerimeterCells(n) {
    const cells = [];
    for (let col = 1; col <= n; col++) cells.push({ row: 1, col });
    for (let row = 2; row <= n; row++) cells.push({ row, col: n });
    for (let col = n - 1; col >= 1; col--) cells.push({ row: n, col });
    for (let row = n - 1; row >= 2; row--) cells.push({ row, col: 1 });
    return cells;
  }

  function hexToRgba(hex, alpha) {
    const h = hex.replace("#", "");
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ---------------- DOM 참조 ----------------
  const setupOverlay = document.getElementById("setup-overlay");
  const appEl = document.getElementById("app");
  const boardEl = document.getElementById("board");
  const cardsEl = document.getElementById("team-cards");
  const turnIndicatorEl = document.getElementById("turn-indicator");
  const diceDisplayEl = document.getElementById("dice-display");
  const rollBtn = document.getElementById("roll-btn");
  const fundBadgeEl = document.getElementById("fund-badge");
  const teacherFundDisplayEl = document.getElementById("teacher-fund-display");
  const teacherTeamSelectEl = document.getElementById("teacher-team-select");

  const modalOverlay = document.getElementById("modal-overlay");
  const modalEmojiEl = document.getElementById("modal-emoji");
  const modalTitleEl = document.getElementById("modal-title");
  const modalBodyEl = document.getElementById("modal-body");
  const modalExtraEl = document.getElementById("modal-extra");
  const modalActionsEl = document.getElementById("modal-actions");

  // ---------------- 시작 화면 ----------------
  document.querySelectorAll(".count-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".count-btn").forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      teamCount = Number(btn.dataset.count);
    });
  });
  document.getElementById("start-game-btn").addEventListener("click", startGame);

  function startGame() {
    teams = [];
    for (let i = 0; i < teamCount; i++) {
      const p = TEAM_PALETTE[i];
      teams.push({
        id: i,
        name: `${i + 1}조`,
        color: p.color,
        light: p.light,
        emoji: p.emoji,
        money: START_MONEY,
        position: 0,
        lands: [],
        skipNext: false,
      });
    }
    currentTeamIndex = 0;
    fund = 0;
    gameStarted = true;

    setupOverlay.classList.add("hidden");
    appEl.classList.remove("hidden");

    renderTeacherSelect();
    renderAll();
  }

  // ---------------- 렌더링 ----------------
  function renderAll() {
    renderBoard();
    renderTeamCards();
    updateTurnIndicator();
    updateFundDisplay();
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    CELLS.forEach((cell, idx) => {
      const sq = boardData[idx];
      const el = document.createElement("div");
      el.className = "square type-" + sq.type;
      el.style.gridRow = cell.row;
      el.style.gridColumn = cell.col;

      if (sq.type === "quiz" && sq.owner !== null) {
        const ownerTeam = teams[sq.owner];
        el.style.background = ownerTeam.color;
        el.classList.add("owned");
      }

      const tokensHere = teams.filter((t) => t.position === idx);
      const priceLabel =
        sq.type === "quiz"
          ? sq.owner !== null
            ? teams[sq.owner].emoji
            : Math.round(sq.price / 10000) + "만"
          : "";

      el.innerHTML = `
        <span class="sq-emoji">${sq.emoji}</span>
        <span class="sq-name">${sq.name}</span>
        ${priceLabel ? `<span class="sq-price">${priceLabel}</span>` : ""}
        <div class="sq-tokens">${tokensHere.map((t) => `<span class="token" title="${t.name}">${t.emoji}</span>`).join("")}</div>
      `;
      boardEl.appendChild(el);
    });
  }

  function renderTeamCards() {
    cardsEl.innerHTML = teams
      .map(
        (t) => `
      <div class="team-card" style="--team-color:${t.color}; --team-light:${t.light}; box-shadow:0 10px 20px ${hexToRgba(t.color, 0.35)};">
        <div class="team-card-head">
          <span class="team-emoji">${t.emoji}</span>
          <span>${t.name}</span>
        </div>
        <div class="team-money">${t.money.toLocaleString()}원</div>
        <div class="team-lands">
          ${
            t.lands.length
              ? t.lands.map((id) => `<span class="land-chip">${boardData[id].emoji} ${boardData[id].name}</span>`).join("")
              : `<span class="land-chip empty">보유한 땅 없음</span>`
          }
        </div>
      </div>
    `
      )
      .join("");
  }

  function updateTurnIndicator() {
    const t = teams[currentTeamIndex];
    turnIndicatorEl.textContent = `${t.emoji} ${t.name} 차례!`;
    turnIndicatorEl.style.background = t.light;
    turnIndicatorEl.style.borderColor = t.color;
  }

  function updateFundDisplay() {
    fundBadgeEl.textContent = `💰 환곡: ${fund.toLocaleString()}원`;
    teacherFundDisplayEl.textContent = `${fund.toLocaleString()}원`;
  }

  function renderTeacherSelect() {
    teacherTeamSelectEl.innerHTML = teams.map((t) => `<option value="${t.id}">${t.emoji} ${t.name}</option>`).join("");
  }

  // ---------------- 주사위 & 이동 ----------------
  const DICE_FACES = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

  rollBtn.addEventListener("click", rollDice);

  function rollDice() {
    if (isMoving || !gameStarted) return;
    const team = teams[currentTeamIndex];

    if (team.skipNext) {
      team.skipNext = false;
      openModal({
        emoji: "😴",
        title: "유배 중...",
        body: `${team.name}는 유배지에서 아직 돌아오지 못했어요. 이번 턴은 쉽니다.`,
        buttons: [{ label: "다음 조로", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
      });
      return;
    }

    isMoving = true;
    rollBtn.disabled = true;
    diceDisplayEl.classList.add("rolling");

    let flickers = 0;
    const flickerTimer = setInterval(() => {
      diceDisplayEl.textContent = DICE_FACES[Math.floor(Math.random() * 6) + 1];
      flickers++;
      if (flickers > 8) {
        clearInterval(flickerTimer);
        diceDisplayEl.classList.remove("rolling");
        const value = Math.floor(Math.random() * 6) + 1;
        diceDisplayEl.textContent = DICE_FACES[value];
        moveToken(team, value);
      }
    }, 80);
  }

  function moveToken(team, steps) {
    let moved = 0;
    const moveTimer = setInterval(() => {
      team.position = (team.position + 1) % boardData.length;
      renderBoard();
      moved++;
      if (moved >= steps) {
        clearInterval(moveTimer);
        isMoving = false;
        handleLanding(team);
      }
    }, 220);
  }

  // ---------------- 칸 도착 처리 ----------------
  function handleLanding(team) {
    const sq = boardData[team.position];

    switch (sq.type) {
      case "start":
        openModal({
          emoji: sq.emoji,
          title: sq.name,
          body: `${team.name}, 출발점 집현전으로 돌아왔습니다!`,
          buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
        });
        break;

      case "prison":
        team.skipNext = true;
        openModal({
          emoji: sq.emoji,
          title: sq.name,
          body: `${team.name}, 유배지에 갇혔습니다! 다음 턴은 쉬어야 해요.`,
          buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
        });
        break;

      case "chance":
        handleChance(team);
        break;

      case "teleport":
        openTeleportModal(team);
        break;

      case "fund": {
        const amount = fund;
        openModal({
          emoji: sq.emoji,
          title: sq.name,
          body:
            amount > 0
              ? `${team.name}, 쌓여있던 환곡 ${amount.toLocaleString()}원을 모두 획득했습니다!`
              : `아직 쌓인 환곡이 없어요. 다음 기회에!`,
          buttons: [
            {
              label: "확인",
              className: "btn-primary",
              onClick: () => {
                team.money += amount;
                fund = 0;
                updateFundDisplay();
                renderTeamCards();
                closeModal();
                nextTurn();
              },
            },
          ],
        });
        break;
      }

      case "quiz":
        if (sq.owner === null) {
          openQuizModal(team, sq);
        } else if (sq.owner === team.id) {
          openModal({
            emoji: sq.emoji,
            title: sq.name,
            body: `${team.name}의 땅이에요! 통행료 없이 지나갑니다.`,
            buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
          });
        } else {
          const owner = teams[sq.owner];
          const toll = Math.round(sq.price * TOLL_RATE);
          team.money = Math.max(0, team.money - toll);
          owner.money += toll;
          renderTeamCards();
          openModal({
            emoji: sq.emoji,
            title: sq.name,
            body: `앗, ${owner.name}의 땅이에요! 통행료 ${toll.toLocaleString()}원을 ${owner.name}에게 지불했습니다.`,
            buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
          });
        }
        break;
    }
  }

  function handleChance(team) {
    const event = CHANCE_EVENTS[Math.floor(Math.random() * CHANCE_EVENTS.length)];
    team.money = Math.max(0, team.money + event.amount);
    const sign = event.amount >= 0 ? "+" : "";
    renderTeamCards();
    openModal({
      emoji: "🔑",
      title: "암행어사 (황금열쇠)",
      body: `${event.text}<br><strong>${sign}${event.amount.toLocaleString()}원</strong>`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
    });
  }

  function openTeleportModal(team) {
    const options = boardData.filter((sq) => sq.id !== 15).map((sq) => `<option value="${sq.id}">${sq.name}</option>`).join("");
    openModal({
      emoji: "🌀",
      title: "축지법",
      body: `순간이동으로 가고 싶은 곳을 골라보세요!`,
      customHTML: `<select id="teleport-select" class="teleport-select">${options}</select>`,
      buttons: [
        {
          label: "이동하기",
          className: "btn-primary",
          onClick: () => {
            const dest = Number(document.getElementById("teleport-select").value);
            team.position = dest;
            closeModal();
            renderBoard();
            handleLanding(team);
          },
        },
      ],
    });
  }

  function openQuizModal(team, sq) {
    openModal({
      emoji: sq.emoji,
      title: sq.name,
      body: `<strong>Q.</strong> ${sq.question}`,
      buttons: [{ label: "정답 확인", className: "btn-primary", onClick: () => showQuizAnswerStage(team, sq) }],
    });
  }

  function showQuizAnswerStage(team, sq) {
    openModal({
      emoji: sq.emoji,
      title: sq.name,
      body: `<strong>Q.</strong> ${sq.question}<br><br><span class="quiz-answer">정답: ${sq.answer}</span><br>실제로 맞혔나요?`,
      buttons: [
        { label: "✅ 정답이었어요", className: "btn-primary", onClick: () => showBuyStage(team, sq) },
        { label: "❌ 오답이었어요", className: "btn-secondary", onClick: () => handleWrongAnswer(team, sq) },
      ],
    });
  }

  function showBuyStage(team, sq) {
    const affordable = team.money >= sq.price;
    const buttons = [];
    if (affordable) {
      buttons.push({
        label: "구매하기 🎉",
        className: "btn-primary",
        onClick: () => {
          team.money -= sq.price;
          sq.owner = team.id;
          team.lands.push(sq.id);
          closeModal();
          renderAll();
          nextTurn();
        },
      });
    }
    buttons.push({
      label: affordable ? "그냥 넘어가기" : "아쉽지만 넘어가기",
      className: "btn-secondary",
      onClick: () => { closeModal(); nextTurn(); },
    });

    openModal({
      emoji: "🎉",
      title: "정답입니다!",
      body:
        `이 땅 <strong>${sq.name}</strong>을(를) ${sq.price.toLocaleString()}원에 구매하시겠어요?` +
        (affordable ? "" : `<br><span class="warn">보유 금액이 부족해서 구매할 수 없어요.</span>`),
      buttons,
    });
  }

  function handleWrongAnswer(team, sq) {
    const toll = Math.round(sq.price * WRONG_RATE);
    team.money = Math.max(0, team.money - toll);
    fund += toll;
    renderTeamCards();
    updateFundDisplay();
    openModal({
      emoji: "😢",
      title: "아쉬워요!",
      body: `오답이었어요. 벌금 ${toll.toLocaleString()}원이 환곡에 쌓였습니다.`,
      buttons: [{ label: "다음 턴으로", className: "btn-primary", onClick: () => { closeModal(); nextTurn(); } }],
    });
  }

  function nextTurn() {
    currentTeamIndex = (currentTeamIndex + 1) % teams.length;
    diceDisplayEl.textContent = "🎲";
    rollBtn.disabled = false;
    updateTurnIndicator();
    renderTeamCards();
  }

  // ---------------- 외래어 적발 ----------------
  function catchForeignWord() {
    if (!gameStarted || teams.length === 0) return;
    const team = teams[currentTeamIndex];
    team.money = Math.max(0, team.money - CATCH_PENALTY);
    fund += CATCH_PENALTY;
    renderTeamCards();
    updateFundDisplay();
    openModal({
      emoji: "🚫",
      title: "외래어 사용 적발!",
      body: `${team.name}, 우리말 대신 외래어를 사용했네요! 벌금 ${CATCH_PENALTY.toLocaleString()}원이 환곡에 쌓였습니다.`,
      buttons: [{ label: "확인", className: "btn-primary", onClick: closeModal }],
    });
  }

  document.getElementById("catch-btn-main").addEventListener("click", catchForeignWord);
  document.getElementById("teacher-catch").addEventListener("click", catchForeignWord);

  // ---------------- 선생님 제어판 ----------------
  const teacherBtn = document.getElementById("teacher-btn");
  const teacherPanel = document.getElementById("teacher-panel");
  const teacherClose = document.getElementById("teacher-close");
  const teacherAmountInput = document.getElementById("teacher-amount");

  teacherBtn.addEventListener("click", () => teacherPanel.classList.remove("hidden"));
  teacherClose.addEventListener("click", () => teacherPanel.classList.add("hidden"));

  document.getElementById("teacher-pay").addEventListener("click", () => {
    const idx = Number(teacherTeamSelectEl.value);
    const amount = Number(teacherAmountInput.value) || 0;
    teams[idx].money += amount;
    renderTeamCards();
  });

  document.getElementById("teacher-deduct").addEventListener("click", () => {
    const idx = Number(teacherTeamSelectEl.value);
    const amount = Number(teacherAmountInput.value) || 0;
    teams[idx].money = Math.max(0, teams[idx].money - amount);
    renderTeamCards();
  });

  // ---------------- 공용 모달 ----------------
  function openModal({ emoji = "", title = "", body = "", customHTML = "", buttons = [] }) {
    modalEmojiEl.textContent = emoji;
    modalTitleEl.textContent = title;
    modalBodyEl.innerHTML = body;
    modalExtraEl.innerHTML = customHTML;
    modalActionsEl.innerHTML = "";
    buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.className = b.className || "btn-primary";
      btn.textContent = b.label;
      btn.addEventListener("click", b.onClick);
      modalActionsEl.appendChild(btn);
    });
    modalOverlay.classList.remove("hidden");
  }

  function closeModal() {
    modalOverlay.classList.add("hidden");
  }
</script>
</body>
</html>
